<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>600-Cell Theory - Concept Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

#container {
  width: 100vw;
  height: 100vh;
  position: relative;
}

svg {
  width: 100%;
  height: 100%;
}

/* Node styles */
.node circle {
  stroke-width: 2;
  cursor: pointer;
  transition: r 0.2s;
}
.node circle:hover {
  filter: brightness(1.3);
}
.node text {
  font-size: 11px;
  fill: #ccc;
  pointer-events: none;
  text-anchor: middle;
  font-weight: 500;
}

/* Link styles */
.link {
  fill: none;
  stroke-opacity: 0.4;
  transition: stroke-opacity 0.2s;
}
.link.highlighted {
  stroke-opacity: 0.9;
  stroke-width: 3 !important;
}

/* Tooltip */
#tooltip {
  position: absolute;
  background: rgba(15, 15, 35, 0.95);
  border: 1px solid rgba(100, 100, 255, 0.3);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  max-width: 380px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  z-index: 1000;
  line-height: 1.5;
}
#tooltip.visible { opacity: 1; }
#tooltip h3 {
  color: #88aaff;
  margin-bottom: 6px;
  font-size: 14px;
}
#tooltip .status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 6px;
}
#tooltip .derived { background: #1a4a2a; color: #44dd88; }
#tooltip .pattern { background: #4a3a1a; color: #ddaa44; }
#tooltip .open { background: #4a1a1a; color: #dd4444; }
#tooltip .structural { background: #1a2a4a; color: #4488dd; }
#tooltip .detail { color: #aaa; font-size: 12px; }
#tooltip .value { color: #88ff88; font-family: 'Consolas', monospace; }

/* Legend */
#legend {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(15, 15, 35, 0.9);
  border: 1px solid rgba(100, 100, 255, 0.2);
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 12px;
  z-index: 100;
}
#legend h3 {
  color: #88aaff;
  margin-bottom: 8px;
  font-size: 13px;
}
.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
  gap: 8px;
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Title */
#title {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 100;
}
#title h1 {
  font-size: 22px;
  color: #88aaff;
  font-weight: 700;
}
#title h2 {
  font-size: 13px;
  color: #667;
  font-weight: 400;
  margin-top: 2px;
}

/* Controls */
#controls {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  gap: 8px;
  z-index: 100;
}
#controls button {
  background: rgba(30, 30, 60, 0.9);
  border: 1px solid rgba(100, 100, 255, 0.3);
  color: #aaa;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}
#controls button:hover {
  background: rgba(50, 50, 100, 0.9);
  color: #fff;
  border-color: rgba(100, 100, 255, 0.6);
}
#controls button.active {
  background: rgba(40, 40, 120, 0.9);
  color: #88aaff;
  border-color: #88aaff;
}

/* Stats bar */
#stats {
  position: absolute;
  bottom: 16px;
  right: 16px;
  background: rgba(15, 15, 35, 0.9);
  border: 1px solid rgba(100, 100, 255, 0.2);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 11px;
  color: #667;
  z-index: 100;
}
#stats span { color: #88ff88; font-family: monospace; }

/* Search */
#search {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
}
#search input {
  background: rgba(15, 15, 35, 0.9);
  border: 1px solid rgba(100, 100, 255, 0.3);
  color: #e0e0e0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  width: 280px;
  outline: none;
  text-align: center;
}
#search input:focus {
  border-color: #88aaff;
}
#search input::placeholder { color: #445; }
</style>

  { source: "alpha", target: "mH", type: "derives" },
  { source: "mass_formula", target: "koide", type: "pattern" },

  // Mixing
  { source: "phi", target: "ckm", type: "derives" },
  { source: "alpha_s", target: "ckm", type: "uses" },
  { source: "sin2tW", target: "ckm", type: "uses" },
  { source: "tqft", target: "pmns", type: "derives" },
  { source: "cayley_spec", target: "ckm", type: "derives" },
  { source: "N", target: "cayley_spec", type: "derives" },

  // Neutrinos & CP
  { source: "mass_formula", target: "neutrino", type: "derives" },
  { source: "N", target: "neutrino", type: "derives" },
  { source: "a1", target: "neutrino", type: "derives" },
  { source: "galois", target: "strongCP", type: "derives" },
  { source: "neutrino", target: "baryogenesis", type: "pattern" },

  // Gravity
  { source: "spectral", target: "seeley", type: "derives" },
  { source: "spectral", target: "graviton", type: "derives" },
  { source: "spectral", target: "starobinsky", type: "structural" },
  { source: "spectral", target: "spectral_data", type: "derives" },
  { source: "b1", target: "spectral_data", type: "derives" },
  { source: "phi", target: "spectral_data", type: "derives" },
  { source: "tqft", target: "hierarchy", type: "derives" },
  { source: "alpha", target: "hierarchy", type: "uses" },
  { source: "spectral_data", target: "hierarchy", type: "derives" },

  // Galois
  { source: "phi", target: "galois", type: "derives" },
  { source: "galois", target: "dark", type: "derives" },
  { source: "galois", target: "galois_cascade", type: "derives" },
  { source: "galois", target: "norm_sum", type: "derives" },
  { source: "norm_sum", target: "b1", type: "confirms" },
  { source: "norm_sum", target: "alpha_s", type: "confirms" },

  // Open problems
  { source: "galois", target: "cc", type: "partial" },
  { source: "alpha", target: "cc", type: "partial" },
  { source: "hierarchy", target: "newton_g", type: "partial" },
  { source: "spectral_data", target: "newton_g", type: "partial" },
  { source: "dark", target: "dm_abundance", type: "partial" },
];

// =========================================================================
// VISUALIZATION
// =========================================================================
const svg = d3.select("#graph");
const width = window.innerWidth;
const height = window.innerHeight;

const statusColors = {
  derived: "#44dd88",
  structural: "#4488dd",
  pattern: "#ddaa44",
  open: "#dd4444"
};

const linkColors = {
  derives: "#336644",
  uses: "#334466",
  confirms: "#446633",
  structural: "#333366",
  pattern: "#664433",
  partial: "#663333"
};

// Create zoom behavior
const zoom = d3.zoom()
  .scaleExtent([0.2, 4])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
  });

svg.call(zoom);

const g = svg.append("g");

// Arrow markers
const defs = svg.append("defs");
Object.entries(linkColors).forEach(([type, color]) => {
  defs.append("marker")
    .attr("id", `arrow-${type}`)
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 25)
    .attr("refY", 0)
    .attr("markerWidth", 6)
    .attr("markerHeight", 6)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", color)
    .attr("opacity", 0.6);
});

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
    const sl = d.source.layer !== undefined ? d.source.layer : 0;
    const tl = d.target.layer !== undefined ? d.target.layer : 0;
    return 60 + Math.abs(sl - tl) * 25;
  }).strength(0.3))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("y", d3.forceY(d => 80 + d.layer * 65).strength(0.12))
  .force("collision", d3.forceCollide().radius(d => d.size + 8));

// Draw links
const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", d => linkColors[d.type] || "#333")
  .attr("stroke-width", d => d.type === "derives" ? 1.5 : 1)
  .attr("stroke-dasharray", d => d.type === "partial" ? "4,4" : d.type === "pattern" ? "2,4" : "none")
  .attr("marker-end", d => `url(#arrow-${d.type})`);

// Draw nodes
const node = g.append("g")
  .selectAll(".node")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended));

// Glow effect
node.append("circle")
  .attr("r", d => d.size + 4)
  .attr("fill", "none")
  .attr("stroke", d => statusColors[d.status])
  .attr("stroke-opacity", 0.15)
  .attr("stroke-width", 8);

// Main circle
node.append("circle")
  .attr("r", d => d.size)
  .attr("fill", d => {
    const c = d3.color(statusColors[d.status]);
    c.opacity = 0.15;
    return c;
  })
  .attr("stroke", d => statusColors[d.status])
  .attr("stroke-width", 2);

// Label
node.append("text")
  .attr("dy", d => d.size + 14)
  .text(d => d.label)
  .attr("font-size", d => d.layer === 0 ? "12px" : "10px")
  .attr("fill", d => statusColors[d.status])
  .attr("opacity", 0.9);

// Value inside node
node.append("text")
  .attr("dy", 3)
  .text(d => d.value && d.value.length < 12 ? d.value : "")
  .attr("font-size", "8px")
  .attr("fill", "#888")
  .attr("font-family", "Consolas, monospace");

// Tooltip
const tooltip = d3.select("#tooltip");

node.on("mouseover", function(event, d) {
  const statusLabel = d.status.charAt(0).toUpperCase() + d.status.slice(1);
  tooltip.html(`
    <h3>${d.label}</h3>
    <span class="status ${d.status}">${statusLabel}</span>
    <div class="detail">${d.detail.replace(/\n/g, "<br>")}</div>
    ${d.value ? `<div class="value" style="margin-top:6px">${d.value}</div>` : ""}
  `)
  .classed("visible", true)
  .style("left", (event.pageX + 15) + "px")
  .style("top", (event.pageY - 10) + "px");

  // Highlight connected
  const connectedIds = new Set();
  connectedIds.add(d.id);
  links.forEach(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });

  node.select("circle:nth-child(2)")
    .attr("opacity", n => connectedIds.has(n.id) ? 1 : 0.2);
  node.select("text")
    .attr("opacity", n => connectedIds.has(n.id) ? 1 : 0.2);
  link
    .attr("stroke-opacity", l => {
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      return (sid === d.id || tid === d.id) ? 0.8 : 0.05;
    })
    .attr("stroke-width", l => {
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      return (sid === d.id || tid === d.id) ? 3 : 1;
    });
});

node.on("mousemove", function(event) {
  tooltip
    .style("left", (event.pageX + 15) + "px")
    .style("top", (event.pageY - 10) + "px");
});

node.on("mouseout", function() {
  tooltip.classed("visible", false);
  node.select("circle:nth-child(2)").attr("opacity", 1);
  node.select("text").attr("opacity", 0.9);
  link.attr("stroke-opacity", 0.4).attr("stroke-width", d => d.type === "derives" ? 1.5 : 1);
});

// Simulation tick
simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

// Drag functions
function dragstarted(event) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  event.subject.fx = event.subject.x;
  event.subject.fy = event.subject.y;
}
function dragged(event) {
  event.subject.fx = event.x;
  event.subject.fy = event.y;
}
function dragended(event) {
  if (!event.active) simulation.alphaTarget(0);
  event.subject.fx = null;
  event.subject.fy = null;
}

// Stats
document.getElementById("nodeCount").textContent = nodes.length;
document.getElementById("linkCount").textContent = links.length;
document.getElementById("derivedCount").textContent = nodes.filter(n => n.status === "derived").length;
document.getElementById("openCount").textContent = nodes.filter(n => n.status === "open").length;

// Reset view
function resetView() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  simulation.alpha(0.3).restart();
}

// Layer filter
let activeFilter = "all";
function toggleLayer(layer) {
  activeFilter = layer;
  document.querySelectorAll("#controls button").forEach(b => b.classList.remove("active"));
  document.getElementById(`btn-${layer}`).classList.add("active");

  const groupMap = {
    gauge: ["gauge", "foundation"],
    mass: ["mass", "foundation", "gauge"],
    mixing: ["mixing", "mass", "foundation"],
    gravity: ["gravity", "foundation"],
    galois: ["galois", "foundation", "mass"]
  };

  const activeGroups = layer === "all" ? null : new Set(groupMap[layer] || [layer]);

  node.attr("opacity", d => !activeGroups || activeGroups.has(d.group) ? 1 : 0.08);
  link.attr("opacity", l => {
    if (!activeGroups) return 1;
    const sg = typeof l.source === "object" ? l.source.group : "";
    const tg = typeof l.target === "object" ? l.target.group : "";
    return activeGroups.has(sg) && activeGroups.has(tg) ? 1 : 0.03;
  });
}

// Search
document.getElementById("searchInput").addEventListener("input", function(e) {
  const q = e.target.value.toLowerCase();
  if (!q) {
    node.attr("opacity", 1);
    link.attr("opacity", 1);
    return;
  }
  const matchIds = new Set();
  nodes.forEach(n => {
    if (n.label.toLowerCase().includes(q) ||
        n.detail.toLowerCase().includes(q) ||
        (n.value && n.value.toLowerCase().includes(q))) {
      matchIds.add(n.id);
    }
  });
  // Also include direct neighbors
  const expandedIds = new Set(matchIds);
  links.forEach(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if (matchIds.has(sid)) expandedIds.add(tid);
    if (matchIds.has(tid)) expandedIds.add(sid);
  });

  node.attr("opacity", d => matchIds.has(d.id) ? 1 : expandedIds.has(d.id) ? 0.4 : 0.06);
  link.attr("opacity", l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    return expandedIds.has(sid) && expandedIds.has(tid) ? 0.6 : 0.03;
  });
});
</script>
</body>
</html>
